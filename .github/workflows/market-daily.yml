name: market-daily
on:
  schedule:
    - cron: "7 22 * * 1-5"   # 화~토 07:07 KST (미국 장 마감 후)
    - cron: "37 13 * * 1-5"  # 월~금 22:37 KST (전일 FRED·연은 갱신분 반영)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: market-daily
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas xlrd
      - run: python scripts/update_market.py
      - name: Commit if changed
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add macro-notes/market/data.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update market indicators $(date -u +%F)"
          git push
      - name: Alerts (open an issue when a signal turns on or off)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          try:
              items = json.load(open("alerts_new.json"))
          except Exception:
              items = []
          for s in items:
              head = "[신호 발생] " if s["on"] else "[신호 해제] "
              title = f'{head}{s["name"]} — {s["value"]} ({s["date"]})'
              body = (f'@bonakim-itm29\n\n- 지표: {s["name"]}\n- 값: {s["value"]} (기준일 {s["date"]})\n'
                      f'- 근거: {s["note"]}\n\n대시보드: https://bonakim-itm29.github.io/macro-notes/market/\n\n'
                      '개인 설정 기준에 따른 자동 알림이며 투자 권유가 아닙니다.')
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body], check=False)
          PY
