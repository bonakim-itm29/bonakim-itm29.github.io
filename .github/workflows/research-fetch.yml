name: research-fetch
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "JSON spec (see scripts/research_fetch.py)"
        required: true
      tag:
        description: "output folder name"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          python scripts/research_fetch.py; mkdir -p out
          echo "::notice::files $(find out -type f | wc -l) log: $(tail -c 900 out/log.txt 2>/dev/null | tr "\n" " ")"
      - name: Save to research-data branch
        if: always()
        run: |
          set +e
          du -sh out; find out -size +50M -print -delete
          cd "$GITHUB_WORKSPACE"
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git fetch -q origin research-data && git checkout -q -B research-data FETCH_HEAD || git checkout -q --orphan research-data
          git rm -rq --cached . >/dev/null 2>&1
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name out -exec rm -rf {} +
          mkdir -p "${{ inputs.tag }}" && cp -r out/. "${{ inputs.tag }}/" && rm -rf out
          git add -A >/tmp/add.log 2>&1 || echo "::error::add $(tail -c 400 /tmp/add.log | tr '\n' ' ')"
          git commit -q -m "research data ${{ inputs.tag }}" >/tmp/c.log 2>&1 || echo "::error::commit $(tail -c 400 /tmp/c.log | tr '\n' ' ')"
          git push -q origin HEAD:refs/heads/research-data >/tmp/p.log 2>&1 || { echo "::error::push $(tail -c 600 /tmp/p.log | tr '\n' ' ')"; exit 1; }
          echo "::notice::saved $(git ls-files | wc -l) files"
